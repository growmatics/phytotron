<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 222" width="760" height="222" role="img" aria-label="Temperature rules on one scale from 6 to 36 C" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
  <title>Temperature rules on one scale from 6 to 36 C</title>
  <defs>
  <linearGradient id="cold" x1="0" x2="1"><stop offset="0" stop-color="#b97c12" stop-opacity=".9"/><stop offset="1" stop-color="#b97c12" stop-opacity=".12"/></linearGradient>
  <linearGradient id="heat" x1="0" x2="1"><stop offset="0" stop-color="#b97c12" stop-opacity=".12"/><stop offset="1" stop-color="#b97c12" stop-opacity=".9"/></linearGradient>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#dcebe2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2c6a4c" stroke-width="1.5" stroke-opacity=".55"/></pattern>
  </defs>
  <text x="50" y="18" fill="#1f2a44" text-anchor="start" font-weight="600">absolute limits</text>
  <rect x="50" y="24" width="88" height="16" fill="#b2432e"/>
  <rect x="666" y="24" width="44" height="16" fill="#b2432e"/>
  <text x="142" y="36" fill="#5b6470" text-anchor="start">fails below 10</text>
  <text x="662" y="36" fill="#5b6470" text-anchor="end">fails above 34</text>
  <text x="50" y="62" fill="#1f2a44" text-anchor="start" font-weight="600">dose builds</text>
  <rect x="138" y="68" width="88" height="16" fill="url(#cold)"/>
  <rect x="578" y="68" width="88" height="16" fill="url(#heat)"/>
  <text x="230" y="80" fill="#5b6470" text-anchor="start">from 14</text>
  <text x="574" y="80" fill="#5b6470" text-anchor="end">from 30</text>
  <text x="50" y="106" fill="#1f2a44" text-anchor="start" font-weight="600">6-day mean band</text>
  <rect x="232.6" y="112" width="52.8" height="16" fill="url(#hatch)"/>
  <rect x="285.4" y="112" width="123.2" height="16" fill="#dcebe2" stroke="#2c6a4c"/>
  <rect x="408.6" y="112" width="52.8" height="16" fill="url(#hatch)"/>
  <rect x="320.6" y="117" width="52.8" height="6" fill="#2c6a4c"/>
  <text x="465.4" y="124" fill="#5b6470" text-anchor="start">target 18.3 to 20.7 with the light, band ±4</text>
  <text x="50" y="150" fill="#1f2a44" text-anchor="start" font-weight="600">24-hour mean cap</text>
  <line x1="490" y1="154" x2="490" y2="174" stroke="#b2432e" stroke-width="2"/>
  <rect x="490" y="158" width="88" height="12" fill="#f3d9d2"/>
  <text x="494" y="168" fill="#b2432e" text-anchor="start">fails above 26</text>
  <line x1="50" y1="190" x2="710" y2="190" stroke="#cfd4db"/>
  <line x1="50" y1="190" x2="50" y2="195" stroke="#5b6470"/>
  <text x="50" y="208" fill="#5b6470" text-anchor="middle">6</text>
  <line x1="94" y1="190" x2="94" y2="195" stroke="#5b6470"/>
  <text x="94" y="208" fill="#5b6470" text-anchor="middle">8</text>
  <line x1="138" y1="190" x2="138" y2="195" stroke="#5b6470"/>
  <text x="138" y="208" fill="#5b6470" text-anchor="middle">10</text>
  <line x1="182" y1="190" x2="182" y2="195" stroke="#5b6470"/>
  <text x="182" y="208" fill="#5b6470" text-anchor="middle">12</text>
  <line x1="226" y1="190" x2="226" y2="195" stroke="#5b6470"/>
  <text x="226" y="208" fill="#5b6470" text-anchor="middle">14</text>
  <line x1="270" y1="190" x2="270" y2="195" stroke="#5b6470"/>
  <text x="270" y="208" fill="#5b6470" text-anchor="middle">16</text>
  <line x1="314" y1="190" x2="314" y2="195" stroke="#5b6470"/>
  <text x="314" y="208" fill="#5b6470" text-anchor="middle">18</text>
  <line x1="358" y1="190" x2="358" y2="195" stroke="#5b6470"/>
  <text x="358" y="208" fill="#5b6470" text-anchor="middle">20</text>
  <line x1="402" y1="190" x2="402" y2="195" stroke="#5b6470"/>
  <text x="402" y="208" fill="#5b6470" text-anchor="middle">22</text>
  <line x1="446" y1="190" x2="446" y2="195" stroke="#5b6470"/>
  <text x="446" y="208" fill="#5b6470" text-anchor="middle">24</text>
  <line x1="490" y1="190" x2="490" y2="195" stroke="#5b6470"/>
  <text x="490" y="208" fill="#5b6470" text-anchor="middle">26</text>
  <line x1="534" y1="190" x2="534" y2="195" stroke="#5b6470"/>
  <text x="534" y="208" fill="#5b6470" text-anchor="middle">28</text>
  <line x1="578" y1="190" x2="578" y2="195" stroke="#5b6470"/>
  <text x="578" y="208" fill="#5b6470" text-anchor="middle">30</text>
  <line x1="622" y1="190" x2="622" y2="195" stroke="#5b6470"/>
  <text x="622" y="208" fill="#5b6470" text-anchor="middle">32</text>
  <line x1="666" y1="190" x2="666" y2="195" stroke="#5b6470"/>
  <text x="666" y="208" fill="#5b6470" text-anchor="middle">34</text>
  <line x1="710" y1="190" x2="710" y2="195" stroke="#5b6470"/>
  <text x="710" y="208" fill="#5b6470" text-anchor="middle">36 C</text>
</svg>
